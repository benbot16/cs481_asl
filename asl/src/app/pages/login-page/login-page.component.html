<div class="min-h-[80vh] h-full w-full py-10 flex flex-wrap flex-col-reverse sm:flex-row items-center min-w-screen">
    <div class="min-w-screen sm:w-[50%] h-full items-center m-auto">
        <img src="../../../assets/asllogo.png" class="w-[650px] m-auto" />
    </div>
    <div class="min-w-screen sm:w-[50%] flex flex-col gap-5 items-center h-full gap-5">
        <div>
            <img src="../../../assets/asllogo.png" class="w-[200px]" />
            <span class="text-navy-600 text-5xl font-light mt-5">Sign 2 Speak</span>
        </div>
        <form [formGroup]="profileForm" (ngSubmit)="doLogin()">
          <p>
          <label class="transition-all w-[400px] bg-white shadow-md flex flex-wrap items-center rounded-lg p-2 hover:shadow-xl justify-between mb-2">
          <input class="grow" type="email" formControlName="email" placeholder="Email Address" />
          </label>
          </p>
          <p>
          <label class="transition-all w-[400px] bg-white shadow-md flex flex-wrap items-center rounded-lg p-2 hover:shadow-xl justify-between mb-2" >
          <input class="grow" type="password" formControlName="password" placeholder="Password"/>
          </label>
          </p>
          <button class="transition-all w-[400px] bg-white shadow-md flex flex-wrap items-center rounded-lg p-2 hover:shadow-xl justify-between" type="submit" [disabled]="!profileForm.valid" [title]="profileForm.valid ? '' : 'Input valid credentials!'">
              <span class="text-slate-700 text-xl flex-grow">Sign in</span>
          </button>
          <button class="transition-all w-[400px] bg-white shadow-md flex flex-wrap items-center rounded-lg p-2 hover:shadow-xl justify-between" (click)="this.goToSignUp()">
              <span class="text-slate-700 text-xl flex-grow">Sign up</span>
          </button>
        </form>
        <button class="transition-all w-[400px] bg-white shadow-md flex flex-wrap items-center rounded-lg p-2 hover:shadow-xl justify-between" (click)="this.doLoginGoogle()">
            <img src="../../../assets/Google.png" class="w-8 m-2" />
            <span class="text-slate-700 text-xl flex-grow">Sign in with Google</span>
        </button>
        <button class="transition-all w-[400px] bg-white shadow-md flex flex-wrap items-center rounded-lg p-2 hover:shadow-xl justify-between" (click)="this.doLoginAnon()">
            <span class="text-slate-700 text-xl flex-grow">Sign in Anonymously</span>
        </button>
    </div>
</div>
