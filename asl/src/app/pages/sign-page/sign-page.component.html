<!-- Main container with full height and navy background -->
<div class="min-h-screen h-full w-full bg-navy-30">
    <!-- Content container with 3/4 width, centered with flex column layout -->
    <div class="w-3/4 bg-navy-10 min-h-screen h-full mx-auto flex flex-col flex-grow pb-56 overflow-auto">
        <!-- Video container for webcam feed with relative positioning for canvas overlay -->
        <div class="w-full flex justify-center items-center p-4 relative">
            <!-- Video element with reference for accessing in TypeScript -->
            <!-- Uses autoplay and playsinline for continuous camera feed -->
            <video #videoElement autoplay playsinline class="w-full max-h-[500px] rounded-lg shadow-lg"></video>
            <!-- Canvas overlay for drawing hand landmarks -->
            <canvas #canvasElement class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
        </div>
        <!-- Container for displaying signed letters history -->
                <div class="w-full flex justify-center p-4">
                    <!-- White box with shadow containing the signed letters -->
                    <div class="w-full max-w-3xl bg-white rounded-lg shadow-lg p-4 max-h-48 overflow-y-auto">
                        <!-- Title for the signed letters section -->
                        <h3 class="text-lg font-semibold text-navy-600 mb-2">Signed Letters History</h3>
                        <!-- Display area for the recognized signed letters -->
                        <!-- Binds to signedLetters property from the component -->
                        <div #outputText class="text-navy-500 text-lg">Current Letter: {{signedLetters}}</div>
                
                        <!-- Display area for the letter history -->
                        <div class="text-navy-500 text-lg mt-2" *ngIf="letterHistory.length > 0">
                            <h4 class="text-md font-semibold text-navy-600 mb-1">Collected Letters:</h4>
                            <div class="border p-2 rounded-lg bg-navy-10 min-h-[40px]">
                                <span *ngFor="let letter of letterHistory" 
                                      class="inline-block" 
                                      [ngClass]="{'px-1': letter === ' ', 'bg-navy-50 rounded': letter === ' '}">
                                    {{letter}}
                                </span>
                            </div>
                        </div>

                        <!-- Display area for the parsed sentence -->
                        <div class="text-navy-500 text-lg mt-2" *ngIf="parsedSentence">
                            <h4 class="text-md font-semibold text-navy-600 mb-1">Parsed Sentence:</h4>
                            <div class="border p-2 rounded-lg bg-navy-10">
                                {{parsedSentence}}
                            </div>
                        </div>
                
                        <!-- Controls for letter collection -->
                        <div class="flex flex-wrap gap-2 mt-4">
                            <!-- Button to toggle letter collection -->
                            <button (click)="toggleLetterCollection()" 
                                    class="px-4 py-2 rounded-lg transition-colors"
                                    [ngClass]="isCollectingLetters ? 
                                        'bg-red-500 hover:bg-red-600 text-white' : 
                                        'bg-green-500 hover:bg-green-600 text-white'">
                                {{isCollectingLetters ? 'Stop Collecting' : 'Start Collecting'}}
                            </button>
                    
                            <!-- Button to add space manually -->
                            <button (click)="addSpace()" 
                                    [disabled]="!isCollectingLetters"
                                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                Add Space
                            </button>
                    
                            <!-- Button to delete last character -->
                            <button (click)="deleteLastChar()" 
                                    [disabled]="letterHistory.length === 0"
                                    class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                Delete Last
                            </button>
                    
                            <!-- Button to parse letters into sentence -->
                            <button (click)="parseLetters()" 
                                    [disabled]="letterHistory.length === 0"
                                    class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                Parse Sentence
                            </button>
                    
                            <!-- Button to clear all -->
                            <button *ngIf="signedLetters || letterHistory.length > 0" 
                                    (click)="clearSignedLetters()" 
                                    class="px-4 py-2 bg-navy-500 text-white rounded-lg hover:bg-navy-600 transition-colors">
                                Clear All
                            </button>
                        </div>
                    </div>
                </div>
    </div>
    <!-- Fixed footer section at bottom of screen with shadow effect -->
    <div class="bg-navy-10 w-full shadow-[0_35px_60px_-15px_rgba(0,0,0,1)] bottom-0 fixed">
    <!-- 
        Commented out section - appears to be for file upload and text messaging functionality
        This could be re-enabled if additional features are needed
    -->
    </div>
</div>
