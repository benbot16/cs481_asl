<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

</head>

<body>

  <div class="wrapper">
    <header>
        <h1>Welcome to Sign2Speak</h1>
      </header>
      <img src="img/asllogo.jpeg" alt="logo">
      <p> American Sign Language (ASL) serves as the primary language for the deaf
        community in America. ASL uses hand gestures for communication. Sign2Speak
        allows users to translate hand gestures to written and spoken English in real time. 
      </p>
    
      <div class="button-group">
        <h3>Getting Started</h3>
        <button id="signHelpButton">Translatable Signs</button>
        <button id="translateHelpButton">How to Translate Gestures</button>
        <button id="startSigningButton">Start Signing</button>
      </div>
  </div>
  <script src="js/navigation.js"></script>
</body>

</html>
